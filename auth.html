<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17131d"><title>Sign in or join Cherri</title>
<style>
:root{color-scheme:dark;--bg:#17131d;--panel:#211b29;--red:#ed1230;--deep:#ad0920;--pink:#ff718c;--text:#fff8f5;--muted:#c8bac8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 10%,#4a1725 0,transparent 38%),radial-gradient(ellipse at 8% 80%,#351522 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
a{color:inherit;text-decoration:none}.shell{width:min(100%,460px)}.brand{display:flex;justify-content:center;align-items:center;gap:10px;font-size:1.5rem;font-weight:850;letter-spacing:-.05em;margin-bottom:26px}.brand img{width:54px;height:54px;object-fit:contain}
.panel{padding:34px;border:1px solid #ffffff20;border-radius:28px;background:#211b29df;box-shadow:0 28px 90px #09060d80;backdrop-filter:blur(16px)}
h1{margin:0;text-align:center;font-size:2rem;letter-spacing:-.055em}.sub{margin:10px 0 26px;text-align:center;color:var(--muted);line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:14px;background:#100d15;margin-bottom:24px}.tabs button{border:0;border-radius:10px;padding:11px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.tabs button[aria-selected=true]{background:#4b1726;color:white;box-shadow:inset 0 0 0 1px #ffffff18}
label{display:block;font-size:.88rem;font-weight:650;margin:16px 0 8px}.field{width:100%;padding:14px 15px;border:1px solid #ffffff24;border-radius:13px;background:#15111b;color:var(--text);font:inherit;outline:none}.field:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ed123026}
.password-wrap{position:relative}.password-wrap .field{padding-right:68px}.toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--pink);font:inherit;font-size:.82rem;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0;color:var(--muted);font-size:.85rem}.row label{display:flex;align-items:center;gap:7px;margin:0;font-weight:400}.row a,.switch a{color:#ff9bad;font-weight:650}
.submit{width:100%;border:0;border-radius:999px;padding:15px;margin-top:12px;background:linear-gradient(110deg,var(--red),var(--deep));color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 30px #ed123033}.submit:hover{filter:brightness(1.08)}
.switch{text-align:center;color:var(--muted);font-size:.9rem;margin:22px 0 0}.fine{text-align:center;color:#958697;font-size:.75rem;line-height:1.55;margin:22px 8px 0}.back{display:block;text-align:center;color:var(--muted);font-size:.88rem;margin-top:22px}
.notice{display:none;padding:12px 14px;border-radius:12px;background:#ed12301a;border:1px solid #ed123055;color:#ffd9e0;font-size:.88rem;line-height:1.5;margin-top:16px}
@media(max-width:480px){body{padding:18px}.panel{padding:25px 20px}}
</style></head>
<body><main class="shell">
<a class="brand" href="index.html"><img src="cherri-logo.svg" alt="">cherri</a>
<section class="panel" aria-labelledby="title">
<h1 id="title">Welcome to Cherri</h1><p class="sub" id="subtitle">Sign in to continue bringing your imagination to life.</p>
<div class="tabs" role="tablist" aria-label="Account access"><button id="signin-tab" role="tab" aria-selected="true" type="button">Sign in</button><button id="signup-tab" role="tab" aria-selected="false" type="button">Create account</button></div>
<form id="auth-form">
<div id="name-field" hidden><label for="name">Your name</label><input class="field" id="name" name="name" autocomplete="name" placeholder="How should we call you?"></div>
<label for="email">Email address</label><input class="field" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<label for="password">Password</label><div class="password-wrap"><input class="field" id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required><button class="toggle" id="toggle-password" type="button">Show</button></div>
<div class="row" id="signin-options"><label><input type="checkbox" name="remember"> Remember me</label><a href="#" id="forgot">Forgot password?</a></div>
<div class="row" id="signup-options" hidden><label><input type="checkbox" required> I agree to the <a href="index.html#terms">terms</a> and privacy policy.</label></div>
<button class="submit" id="submit" type="submit">Sign in</button><div class="notice" id="notice" role="status"></div>
</form><p class="switch" id="switch-copy">New to Cherri? <a href="#" id="switch-link">Create an account</a></p>
</section><p class="fine">Your imagination deserves a place to grow. 🍒</p><a class="back" href="index.html">← Back to Cherri</a>
</main>
<script>
const signInTab=document.getElementById('signin-tab'),signUpTab=document.getElementById('signup-tab'),nameField=document.getElementById('name-field'),signinOptions=document.getElementById('signin-options'),signupOptions=document.getElementById('signup-options'),submit=document.getElementById('submit'),subtitle=document.getElementById('subtitle'),title=document.getElementById('title'),switchCopy=document.getElementById('switch-copy'),notice=document.getElementById('notice'),password=document.getElementById('password');
let mode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'signin';
function setMode(next){mode=next;const signup=mode==='signup';signInTab.setAttribute('aria-selected',String(!signup));signUpTab.setAttribute('aria-selected',String(signup));nameField.hidden=!signup;document.getElementById('name').required=signup;signinOptions.hidden=signup;signupOptions.hidden=!signup;submit.textContent=signup?'Create account':'Sign in';title.textContent=signup?'Create your Cherri account':'Welcome back';subtitle.textContent=signup?'Start turning the moments you imagine into visual stories.':'Sign in to continue bringing your imagination to life.';switchCopy.innerHTML=signup?'Already have an account? <a href="#" id="switch-link">Sign in</a>':'New to Cherri? <a href="#" id="switch-link">Create an account</a>';document.getElementById('switch-link').addEventListener('click',e=>{e.preventDefault();setMode(signup?'signin':'signup')});notice.style.display='none';}
signInTab.addEventListener('click',()=>setMode('signin'));signUpTab.addEventListener('click',()=>setMode('signup'));
document.getElementById('switch-link').addEventListener('click',e=>{e.preventDefault();setMode('signup')});
document.getElementById('toggle-password').addEventListener('click',e=>{password.type=password.type==='password'?'text':'password';e.currentTarget.textContent=password.type==='password'?'Show':'Hide'});
document.getElementById('forgot').addEventListener('click',e=>{e.preventDefault();notice.textContent='Password reset will be available once Cherri’s authentication service is connected.';notice.style.display='block'});
document.getElementById('auth-form').addEventListener('submit',e=>{e.preventDefault();notice.textContent='The sign-in interface is ready. Account creation and login will work once we connect Cherri to an authentication provider.';notice.style.display='block'});
setMode(mode);
</script></body></html>
